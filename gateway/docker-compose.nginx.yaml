services:
  digihome-gateway:
    image: nginx:1.28.0-alpine-slim
    container_name: digihome-gateway
    ports:
      - "8080:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cert/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./cert/server.key:/etc/nginx/ssl/server.key:ro
    restart: unless-stopped
    networks:
      - digihome-network
